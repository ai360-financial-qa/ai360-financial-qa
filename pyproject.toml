[project]
name = "financial-qa"
version = "0.1.0"
description = "Retrieval-augmented question answering over Russian bank annual reports"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "accelerate==1.13.0",
    "aiohttp>=3.13.5",
    "datasets>=4.8.5",
    "dotenv>=0.9.9",
    "einops>=0.8.2",
    "gigachat>=0.2.1",
    "ipycache>=0.1.4",
    "jupyter>=1.1.1",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.9.0",
    "numpy>=2.3.0",
    "openai>=2.37.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "sentence-transformers>=5.5.0",
    "torch>=2.8.0",
    "transformers>=5.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
financial-qa = "financial_qa.cli:main"
financial-qa-mcp = "financial_qa.agent.mcp_server:main"
financial-qa-agent = "financial_qa.agent.agent_loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Modernization and import-order rules ("I", "UP", "B") are not enabled yet:
# they flag ~190 pre-existing style issues. Enable them with a dedicated
# cleanup commit rather than mixing the churn into feature work.
